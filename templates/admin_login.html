{% extends "base.html" %}

{% block title %}Admin Login — KMIE Management Portal{% endblock %}

{% block content %}
<div class="login-container">
  <div class="card login-card">
    <div class="login-header">
      <div class="brand-logo-badge" style="width: 48px; height: 48px; margin: 0 auto 16px auto; font-size: 24px;">
        <span class="logo-icon">🎓</span>
      </div>
      <h1 class="section-title" style="text-align: center; font-size: 20px;">Administrator Login</h1>
      <p class="section-subtitle" style="text-align: center;">Komali Mam Institute of Excellence — Protected Admin Portal</p>
    </div>

    <form method="POST" action="{{ url_for('admin_login') }}" class="login-form" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

      <div class="form-group">
        <label class="form-label" for="username">Username <span class="required">*</span></label>
        <input
          class="form-control"
          type="text"
          id="username"
          name="username"
          placeholder="admin"
          required
          autocomplete="username"
        />
      </div>

      <div class="form-group" style="margin-top: 16px;">
        <label class="form-label" for="password">Password <span class="required">*</span></label>
        <div class="password-input-wrapper">
          <input
            class="form-control"
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
            style="padding-right: 40px;"
          />
          <button
            type="button"
            class="password-toggle-btn"
            id="togglePasswordBtn"
            title="Toggle password visibility"
            aria-label="Toggle password visibility"
          >
            👁️
          </button>
        </div>
      </div>

      <div class="form-actions" style="margin-top: 24px; display: flex; flex-direction: column; gap: 10px;">
        <button type="submit" class="btn btn--primary" style="width: 100%; justify-content: center;">
          <span class="btn-icon">🔐</span>
          Log In to Dashboard
        </button>
        <a href="{{ url_for('index') }}" class="btn btn--ghost" style="width: 100%; justify-content: center;">
          ← Back to Student Portal
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
